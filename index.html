<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WealthFounder — Coming Soon</title>
<style>
  :root {
    --cream: #faf7f2;
    --ink: #382f39;
    --muted: #806e66;
    --accent: #805347;
    --accent-deep: #a65337;
    --line: #ede3d9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 2rem 3rem;
  }
  .wordmark {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 2rem 3rem;
    max-width: 900px;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .eyebrow span {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow::after {
    content: "";
    display: block;
    width: 64px;
    height: 1px;
    background: var(--accent);
  }
  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    line-height: 1.15;
    font-weight: 400;
    margin-bottom: 1.5rem;
  }
  h1 em {
    font-style: italic;
    color: var(--accent-deep);
  }
  .sub {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.1rem;
    line-height: 1.6;
    color: var(--muted);
    max-width: 560px;
  }
  footer {
    padding: 2rem 3rem;
    border-top: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  @media (max-width: 600px) {
    header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
  }
</style>
</head>
<body>
  <header>
    <div class="wordmark">WealthFounder</div>
  </header>
  <main>
    <div class="eyebrow"><span>Coming Soon</span></div>
    <h1>Great businesses deserve the <em>right next chapter.</em></h1>
    <p class="sub">A new way for financial advisors to find their next partner.</p>
  </main>
  <footer>WealthFounder &copy; 2026</footer>
</body>
</html>
